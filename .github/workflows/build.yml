name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Theos & SDK
      run: |
        if [ ! -d "$HOME/theos" ]; then
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
        fi
        
        if [ ! -d "$HOME/theos/sdks" ]; then
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks
        fi

    - name: Download ImGui Base
      run: |
        git clone --depth=1 https://github.com/ocornut/imgui.git imgui_src
        cp imgui_src/*.h ./
        cp imgui_src/*.cpp ./
        rm -rf imgui_src

    - name: Fix Control & Permissions
      run: |
        if [ ! -f "control" ]; then
          echo "Package: com.vietanh.menu" > control
          echo "Name: VietAnh Menu" >> control
          echo "Depends: mobilesubstrate" >> control
          echo "Architecture: iphoneos-arm" >> control
          echo "Description: Mod Menu by VietAnh" >> control
          echo "Maintainer: VietAnh" >> control
          echo "Author: VietAnh" >> control
          echo "Section: Tweaks" >> control
          echo "Version: 1.0.0" >> control
        fi
        chmod +x $HOME/theos/bin/dm.pl

    - name: Compile Dylib
      run: |
        export THEOS=$HOME/theos
        make package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-dylib
        path: packages/*.deb
